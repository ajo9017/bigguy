<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BIG GUY</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e0f1a; overflow: hidden; color: #fff;
    font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; touch-action: none; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 16px; text-align: center; background: rgba(8, 8, 16, .6); overflow-y: auto; box-sizing: border-box; }
  .hidden { display: none !important; }
  h1 { margin: 0; font-size: clamp(44px, 10vw, 88px); letter-spacing: 4px; color: #ffd84a;
    text-shadow: 0 4px 0 #b3401f, 0 10px 24px rgba(0, 0, 0, .6); }
  .sub { font-size: 18px; opacity: .95; line-height: 1.6; }
  .help { font-size: 14px; line-height: 1.7; opacity: .7; }
  .dim { opacity: .7; font-size: 15px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button { font-family: inherit; }
  button.big { font-size: 22px; font-weight: 800; padding: 14px 40px; border: 0; border-radius: 14px; cursor: pointer;
    background: #ffd84a; color: #2a1a0a; box-shadow: 0 5px 0 #b3401f; }
  button.big:active { transform: translateY(3px); box-shadow: 0 2px 0 #b3401f; }
  button.ghost { font-size: 17px; font-weight: 700; padding: 12px 26px; border-radius: 14px; cursor: pointer;
    background: rgba(255, 255, 255, .1); color: #fff; border: 2px solid rgba(255, 255, 255, .35); }
  .newrec { font-size: 26px; font-weight: 900; color: #ffd84a; margin-bottom: 6px; }
  .abrow { font-size: 22px; margin-top: 8px; letter-spacing: 2px; }

  /* 터치 공격 버튼 */
  #touch { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(24px, env(safe-area-inset-bottom)); }
  .tbtn { width: 104px; height: 104px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .55);
    background: rgba(255, 120, 60, .3); color: #fff; font-size: 19px; font-weight: 800; touch-action: none; }
  #touch { display: flex; align-items: flex-end; gap: 14px; }
  #btnDash { width: 76px; height: 76px; font-size: 16px; background: rgba(90, 190, 255, .3); position: relative; overflow: hidden; }
  #btnDash.cool { color: rgba(255, 255, 255, .55); }
  .tbtn.on { background: rgba(255, 255, 255, .4); }

  /* 개선 요청 버튼 */
  #btnChat { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right));
    height: 40px; padding: 0 14px; border-radius: 20px; border: 2px solid rgba(255, 255, 255, .35);
    background: rgba(20, 20, 40, .7); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; z-index: 5; }

  /* 능력 선택 */
  #pick { background: rgba(8, 8, 16, .78); }
  #pickTitle { font-size: 22px; font-weight: 900; color: #ffd84a; }
  .cards { display: flex; gap: 14px; justify-content: center; width: 100%; max-width: 900px; }
  .card { position: relative; flex: 1 1 0; min-width: 0; max-width: 250px; padding: 16px 14px; border-radius: 16px; cursor: pointer;
    background: #232541; color: #fff; border: 3px solid #4b4f86; text-align: center;
    display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .card:hover, .card:active { border-color: #ffd84a; transform: translateY(-2px); }
  .card .icon { font-size: 40px; line-height: 1.1; }
  .card .cname { font-size: 20px; font-weight: 900; }
  .card .clv { font-size: 13px; font-weight: 800; color: #ffd84a; }
  .card .cdesc { font-size: 15px; opacity: .9; line-height: 1.4; }
  .card .ckey { position: absolute; top: 8px; left: 10px; font-size: 12px; opacity: .5; }
  .card .ctext { display: flex; flex-direction: column; gap: 6px; }
  /* 좁은 화면에서도 3장을 가로로 나란히 */
  @media (max-width: 600px) {
    #pickTitle { font-size: 17px; }
    .cards { gap: 8px; }
    .card { padding: 10px 6px; gap: 4px; border-radius: 12px; }
    .card .icon { font-size: 30px; }
    .card .ctext { gap: 4px; }
    .card .cname { font-size: 15px; word-break: keep-all; }
    .card .clv { font-size: 11px; }
    .card .cdesc { font-size: 12px; line-height: 1.35; word-break: keep-all; }
  }

  /* 채팅 */
  #chat { justify-content: flex-start; padding-top: max(24px, env(safe-area-inset-top)); background: rgba(8, 8, 16, .82); }
  .chatBox { width: min(520px, 100%); background: #1d1f38; border-radius: 18px; padding: 16px; box-sizing: border-box;
    display: flex; flex-direction: column; gap: 10px; text-align: left; border: 2px solid #3d4175; }
  .chatHead { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 900; }
  .chatHead button { width: 40px; height: 40px; border: 0; border-radius: 10px; background: rgba(255, 255, 255, .1); color: #fff; font-size: 20px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { padding: 8px 12px; border-radius: 18px; border: 1px solid rgba(255, 255, 255, .3); background: rgba(255, 255, 255, .08); color: #fff; font-size: 14px; }
  #chatText { width: 100%; box-sizing: border-box; min-height: 110px; padding: 12px; border-radius: 12px; border: 2px solid #4b4f86;
    background: #12132a; color: #fff; font-size: 16px; font-family: inherit; resize: vertical; user-select: text; -webkit-user-select: text; }
  .chatNote { font-size: 12px; opacity: .6; line-height: 1.5; }
  #chatSend { align-self: stretch; }
  #chatSend:disabled { opacity: .6; }
  .chatMsg { font-size: 14px; font-weight: 700; min-height: 1em; }
  .chatMsg.ok { color: #7dff9a; }
  .chatMsg.err { color: #ff8a8a; }
  .linkBtn { align-self: flex-start; background: none; border: 0; color: rgba(255, 255, 255, .5); font-size: 12px; padding: 2px 0; cursor: pointer; }
  .ownerRow { display: flex; gap: 8px; }
  #ownerCode { flex: 1; padding: 10px; border-radius: 10px; border: 2px solid #4b4f86; background: #12132a; color: #fff; font-size: 16px; user-select: text; -webkit-user-select: text; }
  .ownerRow .ghost { padding: 8px 16px; font-size: 15px; }
  .histTitle { font-size: 14px; font-weight: 800; opacity: .8; margin-top: 6px; }
  .histItem { font-size: 13px; opacity: .7; padding: 6px 10px; background: rgba(255, 255, 255, .05); border-radius: 8px; word-break: break-all; }
  .chatBox { max-height: calc(100dvh - 48px); overflow-y: auto; }
  .reqItem { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 7px 10px; background: rgba(255, 255, 255, .05);
    border-radius: 8px; color: #fff; text-decoration: none; }
  .reqItem .rt { flex: 1; word-break: break-all; opacity: .85; }
  .reqItem .rn { opacity: .45; font-size: 11px; }
  .badge { flex: none; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 10px; white-space: nowrap; }
  .badge.done { background: #1f6b3a; color: #b9ffcf; }
  .badge.part { background: #5c5a1c; color: #fff4a8; }
  .badge.work { background: #6b4a12; color: #ffd98a; }
  .badge.wait { background: rgba(255, 255, 255, .12); color: #ddd; }
  .badge.no { background: #5a2430; color: #ffb3c0; }

  /* 기록 */
  .recBox { width: min(560px, 100%); background: #1d1f38; border-radius: 18px; padding: 18px; box-sizing: border-box; border: 2px solid #3d4175; }
  .recBox h2 { margin: 0 0 12px; color: #ffd84a; }
  .recGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .recGrid div { background: rgba(255, 255, 255, .06); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; }
  .recGrid .wide { grid-column: span 2; }
  .recGrid b { font-size: 22px; }
  .recGrid span { font-size: 12px; opacity: .65; }
  .recTable { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
  .recTable th { opacity: .6; font-weight: 600; padding: 4px; white-space: nowrap; }
  .recTable td { padding: 6px 4px; border-top: 1px solid rgba(255, 255, 255, .08); }
  .recTable tr.best td { color: #ffd84a; font-weight: 800; }
  .recTable td.ab { font-size: 14px; }
  #records .ghost { margin-top: 14px; }
  #records { justify-content: flex-start; padding-top: max(24px, env(safe-area-inset-top)); }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tab { flex: 1; padding: 10px; border-radius: 10px; border: 2px solid #3d4175; background: transparent; color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; }
  .tab.on { background: #ffd84a; color: #2a1a0a; border-color: #ffd84a; }
  .tab.sub { padding: 7px; font-size: 14px; }
  .recTable tr.me td { background: rgba(255, 216, 74, .22); color: #ffd84a; font-weight: 900; border-top: 1px solid #ffd84a; border-bottom: 1px solid #ffd84a; }
  .recTable tr.me td.nm::before { content: '👉 '; }
  .myName { font-size: 14px; opacity: .8; margin-bottom: 10px; }
  .recTable td.nm { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 이름 입력 */
  .nameRow { display: flex; gap: 8px; align-items: center; }
  .nameRow label { font-size: 15px; font-weight: 700; opacity: .8; }
  #nameInput { width: 170px; padding: 10px 12px; border-radius: 10px; border: 2px solid #4b4f86; background: #12132a; color: #fff;
    font-size: 16px; font-family: inherit; text-align: center; user-select: text; -webkit-user-select: text; }
  .goldLine { font-size: 18px; font-weight: 800; color: #ffd84a; }

  /* 캐릭터 */
  #chars { justify-content: flex-start; padding-top: max(24px, env(safe-area-inset-top)); background: rgba(8, 8, 16, .85); }
  .charBox { width: min(560px, 100%); background: #1d1f38; border-radius: 18px; padding: 16px; box-sizing: border-box; border: 2px solid #3d4175; text-align: left; }
  .charHead { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 900; margin-bottom: 4px; }
  .charUnlock { font-size: 12px; color: #ffd84a; margin-top: 3px; }
  .charHead .gold { color: #ffd84a; }
  #charList { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
  .charCard { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: rgba(255, 255, 255, .06); border: 2px solid transparent; }
  .charCard.sel { border-color: #ffd84a; }
  .charCard.locked .charPrev { filter: brightness(.55) saturate(.6); }
  .charPrev { width: 70px; height: 86px; flex: none; }
  .charInfo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .charName { font-size: 16px; font-weight: 900; }
  .charDesc { font-size: 12px; opacity: .8; line-height: 1.35; word-break: keep-all; }
  .charSkill { font-size: 12px; color: #8fd3ff; font-weight: 700; word-break: keep-all; }
  .charAtk { font-size: 12px; color: #ffb347; font-weight: 700; }
  .charBtn { flex: none; min-width: 78px; padding: 10px 8px; border-radius: 10px; border: 0; font-size: 14px; font-weight: 800; cursor: pointer; background: #ffd84a; color: #2a1a0a; }
  .charBtn:disabled { background: rgba(255, 255, 255, .15); color: #ccc; cursor: default; }
  .rankLine { font-size: 18px; font-weight: 800; color: #8fd3ff; margin-top: 6px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<button id="btnChat">💬 개선 요청</button>

<div id="touch" class="hidden">
  <button class="tbtn" id="btnDash">대시</button>
  <button class="tbtn" id="btnAtk">공격</button>
</div>

<div id="title" class="overlay">
  <h1>BIG GUY</h1>
  <div class="sub">기둥 위에서 버텨라. 떨어지면 끝!</div>
  <div class="help" id="help">이동 WASD / 방향키 · 공격 J / Space · 대시 L / Shift<br>3번 연속 치면 강타! 맞을수록 피해%가 오르고 더 멀리 날아갑니다</div>
  <div class="nameRow">
    <label for="nameInput">이름</label>
    <input id="nameInput" maxlength="12" placeholder="랭킹에 표시될 이름" autocomplete="off" enterkeyhint="go">
  </div>
  <div class="row">
    <button class="big" id="btnStart">시작</button>
    <button class="ghost" id="btnRec">🏆 랭킹</button>
    <button class="ghost" id="btnChars">👤 캐릭터</button>
  </div>
</div>

<div id="over" class="overlay hidden">
  <h1>낙하!</h1>
  <div class="sub" id="overStats"></div>
  <div class="row">
    <button class="big" id="btnRetry">다시 하기</button>
    <button class="ghost" id="btnRec2">🏆 랭킹</button>
    <button class="ghost" id="btnChars2">👤 캐릭터</button>
  </div>
</div>

<div id="chars" class="overlay hidden">
  <div class="charBox">
    <div class="charHead"><span>👤 캐릭터 (<span id="charNow"></span>)</span></div>
    <div class="chatNote">업적을 달성하면 캐릭터가 하나씩 해금돼요. 캐릭터마다 시작 능력과 공격 방식이 달라요.</div>
    <div id="charList"></div>
    <button class="ghost" id="charClose">닫기</button>
  </div>
</div>

<div id="pick" class="overlay hidden">
  <div id="pickTitle"></div>
  <div class="cards" id="cards"></div>
</div>

<div id="skillInfo" class="overlay hidden">
  <div class="cards" id="skillCards" style="flex-direction:column;align-items:center;max-width:320px"></div>
  <button class="ghost" id="skillClose">닫기 (일시정지 해제)</button>
</div>

<div id="records" class="overlay hidden">
  <div class="recBox">
    <div class="tabs">
      <button class="tab on" data-tab="rank">🌏 전체 랭킹</button>
      <button class="tab" data-tab="mine">🏆 내 기록</button>
    </div>
    <div id="rankBody">
      <div class="myName" id="myName"></div>
      <div class="tabs subs" id="rankTabs">
        <button class="tab sub on" data-period="today">오늘</button>
        <button class="tab sub" data-period="week">주간</button>
        <button class="tab sub" data-period="all">누적</button>
      </div>
      <div class="chatNote" id="rankReset"></div>
      <div id="rankList"></div>
    </div>
    <div id="recBody" class="hidden"></div>
    <button class="ghost" id="recClose">닫기</button>
  </div>
</div>

<div id="chat" class="overlay hidden">
  <div class="chatBox">
    <div class="chatHead">💬 게임 개선 요청 <button id="chatClose" aria-label="닫기">✕</button></div>
    <div class="chips">
      <button class="chip">적 추가</button>
      <button class="chip">능력 추가</button>
      <button class="chip">밸런스</button>
      <button class="chip">그래픽</button>
      <button class="chip">버그</button>
    </div>
    <textarea id="chatText" placeholder="예: 얼음을 던지는 적을 추가해줘"></textarea>
    <button class="big" id="chatSend">보내기</button>
    <div class="chatMsg" id="chatMsg"></div>
    <button class="linkBtn" id="ownerToggle"></button>
    <div class="ownerRow hidden" id="ownerRow">
      <input id="ownerCode" type="password" placeholder="주인 코드" autocomplete="off">
      <button class="ghost" id="ownerSave">저장</button>
    </div>
    <div id="chatHist"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
